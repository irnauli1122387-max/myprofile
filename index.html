<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Ringkas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        /* Container utama menggunakan Flexbox */
        .profil-container {
            display: flex; /* Membuat teks dan foto sejajar samping-sampingan */
            justify-content: space-between; /* Teks di kiri, foto di kanan */
            align-items: center; /* Menyejajarkan teks dan foto secara vertikal di tengah */
            max-width: 700px;
            margin: 0 auto;
        }

        .teks-kiri {
            flex: 1; /* Mengisi sisa ruang di sebelah kiri */
            padding-right: 20px; /* Jarak antara teks dan foto */
        }

        .teks-kiri h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .teks-kiri p {
            line-height: 1.6;
            margin-bottom: 8px;
        }

        /* Style untuk membuat foto berbentuk bulat */
        .foto-bulat {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Trik utama membuat gambar jadi bulat sempurna */
            object-fit: cover; /* Agar gambar tidak terdistorsi/gepeng */
            flex-shrink: 0; /* Mencegah foto menciut jika layar mengecil */
        }
    </style>
</head>
<body>

    <div class="profil-container">
        <!-- Teks di sebelah kiri -->
        <div class="teks-kiri">
            <h1>Halooooo, Selamat Datang</h1>
            <p>Saya adalah Irnauli Hasibuan, Mahasiswa di Universitas Medan Area dengan prodi Teknik Informatika. Saat ini saya sedang belajar menggunakan GitHub, pantau terus perjalanan saya di sini.</p>
            <p><strong>Nama :</strong> Irnauli Hasibuan</p>
            <p><strong>NPM :</strong> 248160064</p>
        </div>

        <!-- Foto di sebelah kanan -->
        <img src="foto.jpg.jpeg" alt="Foto Profil" class="foto-bulat">
    </div>

</body>
</html>
